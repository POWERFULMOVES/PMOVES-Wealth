name: Publish Docker image (GHCR)

on:
  push:
    branches: [ main, PMOVES.AI-Edition-Hardened ]
    tags: [ 'v*.*.*' ]

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            # latest tag for the default branch (PMOVES.AI-Edition-Hardened)
            type=raw,value=latest,enable={{is_default_branch}}
            # pmoves-latest for PMOVES.AI-Edition-Hardened branch
            type=raw,value=pmoves-latest,enable=${{ github.ref == 'refs/heads/PMOVES.AI-Edition-Hardened' }}
            # main tag for main branch (upstream sync branch)
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            # branch-specific tags (e.g., PMOVES.AI-Edition-Hardened, main)
            type=ref,event=branch
            # short SHA tag for both branches
            type=sha
            # version tags for releases (v*.*.*)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

